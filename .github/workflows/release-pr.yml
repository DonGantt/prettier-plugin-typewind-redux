name: Open Release PR

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Open or refresh the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin --quiet

          commits="$(git log origin/main..origin/development --oneline)"
          if [[ -z "$commits" ]]; then
            echo "development has nothing new to release"
            exit 0
          fi

          body="$(git log origin/main..origin/development --pretty=format:'- %s (%h)')"

          existing_pr="$(gh pr list --base main --head development --state open \
            --json number,title \
            --jq '.[] | select(.title | startswith("release:")) | .number' | head -1)"

          if [[ -n "$existing_pr" ]]; then
            echo "Refreshing existing release PR #$existing_pr"
            gh pr edit "$existing_pr" --body "$body"
          else
            title="release: $(date +%F)"
            echo "Opening new release PR: $title"
            gh pr create --base main --head development --title "$title" --body "$body"
          fi
